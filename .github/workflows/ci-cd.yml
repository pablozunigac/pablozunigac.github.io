name: CI/CD & Documentation Pipeline

on:
  push:
    branches: [ quarto-migration, main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: "pages-deployment"
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Crucial: Descarga todo el historial de git para que Quarto lea 'last-modified'

      - name: Setup Quarto Environment
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2
        # Quarto compila index.qmd, lee {{< meta date >}} y lo reemplaza con la fecha de Git automáticamente

      - name: Setup Pages Configuration
        uses: actions/configure-pages@v5

      - name: Upload Artifacts for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/quarto-migration') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4