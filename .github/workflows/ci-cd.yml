name: CI/CD & Documentation Pipeline

on:
  push:
    branches: [ quarto-migration, main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: "pages-deployment"
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para leer el historial de git de cada archivo

      - name: Setup Quarto Environment
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - name: Inject Timestamp and Commit Back
        run: |
          # Configurar identidad temporal para el commit automático del bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Iterar sobre los archivos .md para actualizar su etiqueta span
          for file in *.md; do
            if [ -f "$file" ]; then
              # Extraer la fecha del último commit de ese archivo específico
              FILE_DATE=$(git log -1 --format="%cd" --date=format:'%Y-%m-%d, %H:%M' -- "$file")
              if [ -n "$FILE_DATE" ]; then
                # Reemplazar dentro de la etiqueta <span id="timestamp_en">
                sed -i "s|<span id=\"timestamp_en\">.*</span>|<span id=\"timestamp_en\">${FILE_DATE} UTC-4</span>|g" "$file"
              fi
            fi
          done

          # Si hubo cambios en los archivos .md, los guardamos y hacemos commit/push automático
          git add *.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update markdown timestamps [skip ci]"
            git push
          fi

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2

      - name: Setup Pages Configuration
        uses: actions/configure-pages@v5

      - name: Upload Artifacts for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/quarto-migration') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4