name: CI/CD & Documentation Pipeline

on:
  push:
    branches: [ quarto-migration, main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: "pages-deployment"
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para leer el historial de git de cada archivo

      - name: Setup Quarto Environment
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - name: Inject Individual File Timestamps to Markdown
        run: |
          for file in *.md; do
            if [ -f "$file" ]; then
              # --diff-filter=d (ignora archivos borrados)
              # -1: busca el commit más reciente donde el archivo realmente cambió su contenido
              # Esto filtra los "add ." que no modificaron el archivo.
              FILE_DATE=$(git log -1 --format="%cd" --date=format:'%Y-%m-%d, %H:%M' -- "$file")
              
              if [ -n "$FILE_DATE" ]; then
                sed -i "s|^\*\*Last Update:\*\*.*|\*\*Last Update:\*\* ${FILE_DATE} [UTC-4.]|g" "$file"
              fi
            fi
          done

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2

      - name: Setup Pages Configuration
        uses: actions/configure-pages@v5

      - name: Upload Artifacts for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/quarto-migration') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4