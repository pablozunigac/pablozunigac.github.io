name: Update Footer Timestamp

on:
  push:
    branches: [ main ]
    paths:
      - 'index.md'
      - 'es/cv.md'
      - 'en/resume.md'
      - 'README.md'

concurrency:
  group: timestamp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update-timestamp:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Timestamp In-Memory
        run: |
          TIMESTAMP_EN=$(date -u +'%Y-%m-%d, %H:%M UTC')
          TIMESTAMP_ES=$(date -u +'%d-%m-%Y, %H:%M UTC')

          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          TARGETS="es/cv.md en/resume.md index.md README.md"

          for FILE in $CHANGED_FILES; do
            if echo "$TARGETS" | grep -qw "$FILE"; then
              if [ -f "$FILE" ]; then
                echo "Actualizando timestamp en: $FILE"
                
                if [ "$FILE" = "index.md" ] || [ "$FILE" = "en/resume.md" ] || [ "$FILE" = "README.md" ]; then
                  sed -i "s|<span id=\"timestamp_en\">[^<]*</span>|<span id=\"timestamp_en\">${TIMESTAMP_EN}</span>|g" "$FILE"
                elif [ "$FILE" = "es/cv.md" ]; then
                  sed -i "s|<span id=\"timestamp_es\">[^<]*</span>|<span id=\"timestamp_es\">${TIMESTAMP_ES}</span>|g" "$FILE"
                fi
              fi
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4