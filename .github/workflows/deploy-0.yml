name: Update Footer Timestamp

on:
  push:
    branches: [ main ]
    paths:
      - 'index.md'
      - 'es/cv.md'
      - 'en/resume.md'
      - 'README.md'

concurrency:
  group: timestamp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Timestamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TIMESTAMP_EN=$(date -u +'%Y-%m-%d, %H:%M UTC')
          TIMESTAMP_ES=$(date -u +'%d-%m-%Y, %H:%M UTC')

          # Reemplazo directo sin condicionales frágiles
          sed -i "s|<span id=\"timestamp_en\">[^<]*</span>|<span id=\"timestamp_en\">${TIMESTAMP_EN}</span>|g" index.md || true
          sed -i "s|<span id=\"timestamp_en\">[^<]*</span>|<span id=\"timestamp_en\">${TIMESTAMP_EN}</span>|g" en/resume.md || true
          sed -i "s|<span id=\"timestamp_en\">[^<]*</span>|<span id=\"timestamp_en\">${TIMESTAMP_EN}</span>|g" README.md || true
          sed -i "s|<span id=\"timestamp_es\">[^<]*</span>|<span id=\"timestamp_es\">${TIMESTAMP_ES}</span>|g" es/cv.md || true

          git add index.md en/resume.md README.md es/cv.md

          # Si no hay cambios reales, salir limpiamente
          if git diff --staged --quiet; then
            echo "Sin cambios en timestamps."
            exit 0
          fi

          git commit -m "docs: auto-update timestamp [skip ci]"
          git pull --rebase origin main
          git push origin main