name: Deploy Pages with Timestamps

on:
  push:
    branches: [ main ]
    paths:
      - 'index.md'
      - 'es/cv.md'
      - 'en/resume.md'
      - 'README.md'

concurrency:
  group: timestamp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Timestamps In-Memory
        run: |
          TIMESTAMP_EN=$(date -u +'%Y-%m-%d, %H:%M UTC')
          TIMESTAMP_ES=$(date -u +'%d-%m-%Y, %H:%M UTC')

          # Inyecta la fecha directamente en los objetivos siempre
          sed -i "s|<span id=\"timestamp_en\">[^<]*</span>|<span id=\"timestamp_en\">${TIMESTAMP_EN}</span>|g" index.md || true
          sed -i "s|<span id=\"timestamp_en\">[^<]*</span>|<span id=\"timestamp_en\">${TIMESTAMP_EN}</span>|g" en/resume.md || true
          sed -i "s|<span id=\"timestamp_en\">[^<]*</span>|<span id=\"timestamp_en\">${TIMESTAMP_EN}</span>|g" README.md || true
          sed -i "s|<span id=\"timestamp_es\">[^<]*</span>|<span id=\"timestamp_es\">${TIMESTAMP_ES}</span>|g" es/cv.md || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4