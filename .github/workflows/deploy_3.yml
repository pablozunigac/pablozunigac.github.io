name: Deploy Pages with Dynamic Timestamp

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Timestamp strictly
        run: |
          NOW_EN="$(date -u +'%Y-%m-%d, %H:%M UTC')"
          NOW_ES="$(date -u +'%d-%m-%Y, %H:%M UTC')"

          # Desactivar Jekyll para que no pise los cambios hechos en memoria
          touch .nojekyll

          # Reemplazo exacto sobre las etiquetas span
          find . -type f \( -name "index.md" -o -name "README.md" -o -name "resume.md" \) \
            -exec sed -i "s|<span id=\"timestamp_en\">[^<]*</span>|<span id=\"timestamp_en\">${NOW_EN}</span>|g" {} +

          find . -type f -name "cv.md" \
            -exec sed -i "s|<span id=\"timestamp_es\">[^<]*</span>|<span id=\"timestamp_es\">${NOW_ES}</span>|g" {} +

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4