name: Deploy Pages with Dynamic Timestamp

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Timestamp Script into Markdown
        run: |
          NOW=$(date -u +'%Y-%m-%d, %H:%M UTC')
          NOW_ES=$(date -u +'%d-%m-%Y, %H:%M UTC')

          # Inyección de texto estático directo para el HTML renderizado
          find . -type f \( -name "index.md" -o -name "README.md" -o -name "resume.md" \) \
            -exec sed -i "s|<span id=\"timestamp_en\">[^<]*</span>|${NOW}|g" {} +

          find . -type f -name "cv.md" \
            -exec sed -i "s|<span id=\"timestamp_es\">[^<]*</span>|${NOW_ES}|g" {} +

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4