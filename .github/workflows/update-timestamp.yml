name: Update Footer Timestamp

on:
  push:
    branches: [ main ]
    paths:
      - 'es/cv.md'
      - 'en/resume.md'
      - 'index.md'
      - 'README.md'

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update Timestamp in Markdown Files
        run: |
          TIMESTAMP=$(date -u +'%d-%m-%Y, %H:%M UTC')
          
          # Lista exacta de archivos a auditar
          FILES=("es/cv.md" "en/resume.md" "index.md" "README.md")
          
          for FILE in "${FILES[@]}"; do
            if [ -f "$FILE" ]; then
              sed -i "s|<span id=\"footer_timestamp\">.*</span>|<span id=\"footer_timestamp\">${TIMESTAMP}</span>|g" "$FILE"
            fi
          done

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update timestamp [skip ci]"
