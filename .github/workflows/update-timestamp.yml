name: Deploy GitHub Pages with Dynamic Timestamp

on:
  push:
    branches: [ main, new-timestamp ]

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Inject Timestamps in-memory (Build Time)
        run: |
          TIMESTAMP_EN=$(date -u +'%Y-%m-%d, %H:%M UTC')
          TIMESTAMP_ES=$(date -u +'%d-%m-%Y, %H:%M UTC')

          echo "Inyectando marca de tiempo en la etapa de compilación..."

          find . -type f \( -name "index.md" -o -name "README.md" -o -name "resume.md" \) \
            -exec sed -i "s|<span id=\"timestamp_en\">[^<]*</span>|<span id=\"timestamp_en\">${TIMESTAMP_EN}</span>|g" {} +

          find . -type f -name "cv.md" \
            -exec sed -i "s|<span id=\"timestamp_es\">[^<]*</span>|<span id=\"timestamp_es\">${TIMESTAMP_ES}</span>|g" {} +

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload HTML/Markdown Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4