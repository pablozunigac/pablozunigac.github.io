name: Update Footer Timestamp

on:
  push:
    branches: [ main, master ]
    paths:
      - 'es/cv.md'
      - 'en/resume.md'
      - 'index.md'
      - 'README.md'

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Timestamp
        run: |
          TIMESTAMP=$(date -u +'%d-%m-%Y, %H:%M UTC')
          
          # Actualiza ÚNICAMENTE los archivos que el usuario modificó en su push
          git diff --name-only HEAD~1 | grep -E '^(es/cv\.md|en/resume\.md|index\.md|README\.md)$' | while read -r FILE; do
            sed -i "s|<span id=\"footer_timestamp\">.*</span>|<span id=\"footer_timestamp\">${TIMESTAMP}</span>|g" "$FILE"
          done

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update timestamp"
