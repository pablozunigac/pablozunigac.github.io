name: Deploy Quarto Site

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Traer todo el historial de commits
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. RESTAURAR las fechas reales de modificacion de cada archivo desde Git
      - name: Restore timestamps from Git history
        uses: chetan/git-restore-mtime-action@v2

      # 3. Configurar Quarto
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 4. Compilar forzando UTC
      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2
        env:
          TZ: "UTC"