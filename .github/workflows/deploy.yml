name: Deploy Pages with Timestamp

on:
  push:
    branches: [ main-2 ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Last Commit Date
        run: |
          # Extrae la fecha del ÚLTIMO COMMIT REAL que tocó index.md
          LAST_COMMIT_DATE=$(git log -1 --format="%cd" --date=format:'%Y-%m-%d, %H:%M UTC' -- index.md)
          
          # Reemplaza la etiqueta solo con la fecha real del cambio de contenido
          sed -i "s|<span id=\"timestamp_en\">.*</span>|<span id=\"timestamp_en\">${LAST_COMMIT_DATE}</span>|g" index.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Empaqueta la carpeta con los .md YA modificados

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # Entrega el paquete al servidor web