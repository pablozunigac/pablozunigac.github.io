name: Deploy Pages with Timestamp

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Timestamps In-Memory
        run: |
          TS_EN=$(date -u +'%Y-%m-%d, %H:%M UTC')
          TS_ES=$(date -u +'%d-%m-%Y, %H:%M UTC')

          echo "=== 1. FECHA GENERADA ==="
          echo "EN: ${TS_EN}"
          echo "ES: ${TS_ES}"

          echo "=== 2. CONTENIDO ANTES DEL SED ==="
          grep -n "timestamp" index.md || echo "NO SE ENCONTRÓ LA ETIQUETA EN INDEX.MD"

          # Ejecutar reemplazo
          sed -i "s|<span id=\"timestamp_en\">.*</span>|<span id=\"timestamp_en\">${TS_EN}</span>|g" index.md
          sed -i "s|<span id=\"timestamp_es\">.*</span>|<span id=\"timestamp_es\">${TS_ES}</span>|g" index.md

          echo "=== 3. CONTENIDO DESPUÉS DEL SED ==="
          grep -n "timestamp" index.md || echo "FALLÓ EL REEMPLAZO"

          touch .nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Empaqueta la carpeta con los .md YA modificados

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # Entrega el paquete al servidor web