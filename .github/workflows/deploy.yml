name: Deploy GitHub Pages

on:
  push:
    branches: [ main2 ]
  workflow_dispatch: # Permite disparar el despliegue manualmente si es necesario

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Static Site
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages Engine
        uses: actions/configure-pages@v5

      - name: Upload Site & Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Directorio raíz a publicar

      - name: Deploy to GitHub Pages CDN
        id: deployment
        uses: actions/deploy-pages@v4