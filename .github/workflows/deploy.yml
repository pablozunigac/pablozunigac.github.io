name: Deploy Quarto Site

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Traer todo el historial de commits para que Git conozca las fechas reales de modificación
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar Quarto
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 3. Compilar forzando UTC y respetando el historial de Git
      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2
        env:
          TZ: "UTC" # Forzar siempre UTC+0