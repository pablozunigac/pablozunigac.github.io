name: Deploy Pages with Timestamp

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Timestamps In-Memory
        run: |
          TS_EN=$(date -u +'%Y-%m-%d, %H:%M UTC')
          TS_ES=$(date -u +'%d-%m-%Y, %H:%M UTC')

          # Reemplaza el contenido dentro de los spans en todos los archivos .md
          find . -type f -name "*.md" -exec sed -i "s|<span id=\"timestamp_en\">.*</span>|<span id=\"timestamp_en\">${TS_EN}</span>|g" {} +
          find . -type f -name "*.md" -exec sed -i "s|<span id=\"timestamp_es\">.*</span>|<span id=\"timestamp_es\">${TS_ES}</span>|g" {} +

          # Evita que Jekyll procese o filtre la estructura de carpetas
          # touch .nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4