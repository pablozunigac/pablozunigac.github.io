name: Update Footer Timestamp

concurrency:
  group: timestamp-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - 'es/cv.md'
      - 'en/resume.md'
      - 'index.md'
      - 'README.md'

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Necesario para comparar HEAD con el commit previo (HEAD~1)

      - name: Update Timestamp in Changed Files
        run: |
          TIMESTAMP=$(date -u +'%d-%m-%Y, %H:%M UTC')

          # Identifica los archivos cambiados en este push
          git diff --name-only HEAD~1 HEAD \
            | grep -xE 'es/cv\.md|en/resume\.md|index\.md|README\.md' \
            | xargs -r sed -i "s|<span id=\"footer_timestamp\">[^<]*</span>|<span id=\"footer_timestamp\">${TIMESTAMP}</span>|g"

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update footer timestamp [skip ci]"
          file_pattern: "es/cv.md en/resume.md index.md README.md"
